<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11271d"><title>CHEGALLUSS CONTROL v1.3</title>
<style>
:root{--bg:#f4f6f0;--fg:#14281e;--muted:#64736a;--card:#fff;--green:#1c6b43;--lime:#d7ef9a;--line:#e2e8df;--red:#a52b2b;--yellow:#f6e6af;--shadow:0 8px 30px #0b23100a}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#11271d;color:#fff;padding:18px max(18px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{font-size:20px;letter-spacing:.09em;margin:0}header small{color:#bad0c2}.brand{display:flex;gap:12px;align-items:center}.brand-icon{background:#d7ef9a;color:#163522;border-radius:14px;padding:10px;font-size:22px}.topbar{display:flex;gap:8px;align-items:center}select,input,textarea{background:#fff;border:1px solid #cdd9ce;border-radius:12px;padding:11px 12px;width:100%;min-width:0;color:var(--fg)}header select{width:auto;background:#203d2f;color:#fff;border-color:#486351}.shell{max-width:1120px;margin:auto;padding:18px 18px 90px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.nav button{border:0;border-radius:12px;background:#e5ebe3;padding:11px 14px;white-space:nowrap;font-weight:700;color:#3e5345}.nav button.active{background:#235c3f;color:white}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.sectionTitle h2{margin:0;font-size:23px}.muted{color:var(--muted)}.tiny{font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.card b{font-size:clamp(17px,2.1vw,25px);display:block;line-height:1.3;margin-top:8px;overflow-wrap:anywhere}.panel{margin-top:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pill{display:inline-block;border-radius:99px;background:#e5f5dc;color:#22663a;font-size:12px;font-weight:800;padding:5px 9px}.pill.warn{background:#fff0bf;color:#805614}.pill.danger{background:#ffe1db;color:#9f3023}h3{margin:0 0 10px;font-size:17px}.barrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.barrow:last-child{border:0}.big-btn{border:0;background:var(--green);color:#fff;border-radius:13px;padding:13px 17px;font-weight:750}.secondary{background:#edf1e9;color:#244532}.dangerbtn{background:#fbe6e4;color:#9d2626}.buttonrow{display:flex;flex-wrap:wrap;gap:8px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{padding:19px;border:1px solid #dce7d6;background:#fff;border-radius:16px;text-align:left;color:#153d29;min-height:98px}.action strong{display:block;margin:5px 0}.action span{font-size:24px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:680;font-size:13px}.wide{grid-column:1/-1}.help{font-size:12px;color:#758378}.notice{background:#fff6d6;padding:12px;border-radius:13px;border:1px solid #f0df9c}.error{background:#fee9e5;color:#9c2921;border-color:#f5bcb2}.success{background:#e9f5e6;color:#28633b;border-color:#cce4c7}.tablewrap{width:100%;overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:#52685a;font-size:12px}td.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabbar button{background:#e8eee7;color:#315440;border:0;border-radius:10px;padding:9px 12px}.tabbar button.active{background:var(--green);color:#fff}.empty{padding:22px;text-align:center;color:#657669}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center}.checkline{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px}.checkline input{width:18px;height:18px}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 20px;color:#fff;background:#143927;border-radius:12px;box-shadow:0 6px 24px #0002;z-index:15;max-width:92vw}.footer{font-size:12px;color:#788579;margin:18px 0}.circle{height:9px;width:9px;display:inline-block;border-radius:50%;background:#dd952e;margin-right:6px}@media(max-width:750px){header{padding:14px 16px}header h1{font-size:16px}.shell{padding:12px 12px 84px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.sectionTitle h2{font-size:21px}.topbar{flex-direction:column;align-items:end}.topbar select{font-size:12px;padding:7px}.card{padding:13px}.formgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}@media print{header,.nav,.buttonrow,.big-btn,.topbar{display:none!important}.shell{padding:0}body{background:#fff}.panel,.card{box-shadow:none;break-inside:avoid}}
</style></head><body><header><div class="brand"><span class="brand-icon">🐓</span><div><h1>CHEGALLUSS</h1><small>CONTROL · v1.7 · Prototype</small></div></div><div class="topbar"><select id="role" aria-label="Mode pengguna"><option value="owner">👑 Mode Owner</option><option value="admin">📝 Mode Admin</option></select><small>Data tersimpan di browser ini</small></div></header><main class="shell"><nav id="nav" class="nav"></nav><div id="view"></div><p class="footer">PROTOTIPE LOKAL · Tidak memakai server/login asli · Jangan digunakan sebagai pembukuan produksi sebelum sistem keamanan dan sinkronisasi diterapkan.</p></main><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';const KEY='chegalluss_control_v10';const historicalFarms=['KD Toto','KD Suncang','KD Chandra','KD Nedi','KD Nedi Broiler'];const cats=['DOC','Pakan','Vaksin','Obat','Vitamin','Jasa Vaksin','Alat Kandang','Tenaga Kerja','Transportasi','Listrik/Air','Lainnya'];const money=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');const fmt=n=>(Number(n)||0).toLocaleString('id-ID',{maximumFractionDigits:2});const iso=()=>new Date().toLocaleDateString('en-CA');const id=()=>('id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const parseRp=n=>{let t=String(n??'').trim().replace(/\s|Rp/gi,'');if(!t)return NaN;if(!/^\d[\d.]*$/.test(t))return NaN;return Number(t.replace(/\./g,''))};const val=n=>Math.max(0,Number(n)||0);const sum=(arr,k)=>arr.reduce((t,x)=>t+val(x[k]),0);const sample=()=>({farms:[],farmDetails:{},cycles:[],expenses:[],sales:[],cash:[],daily:[],audit:[],distributors:[],supplierLedger:[],corrections:[],products:[],notaGroups:[],demo:false});let db;try{db=JSON.parse(localStorage.getItem(KEY))||sample()}catch{db=sample()}db.farms=Array.isArray(db.farms)?db.farms:[];db.farmDetails=db.farmDetails||{};db.distributors=Array.isArray(db.distributors)?db.distributors:[];db.supplierLedger=Array.isArray(db.supplierLedger)?db.supplierLedger:[];db.corrections=Array.isArray(db.corrections)?db.corrections:[];db.products=Array.isArray(db.products)?db.products:[];db.notaGroups=Array.isArray(db.notaGroups)?db.notaGroups:[];db.advances=Array.isArray(db.advances)?db.advances:[];let editTarget=null;let role='owner',page='dashboard',form='expense',filter='Semua',selectedCycle='all';const persist=()=>localStorage.setItem(KEY,JSON.stringify(db));const audit=(action,detail)=>db.audit.unshift({id:id(),date:new Date().toISOString(),role,action,detail});const toast=msg=>{let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200)};const options=(arr,placeholder)=> (placeholder?`<option value="">${esc(placeholder)}</option>`:'')+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');const supplierBalance=sid=>db.supplierLedger.filter(x=>x.supplierId===sid).reduce((a,x)=>a+((x.kind==='deposit'||x.kind==='sale_credit')?x.amount:-x.amount),0);const distributorOpt=()=>options(db.distributors.map(x=>x.id+'|'+x.name),'Pilih distributor');const activeFarms=()=>db.farms.filter(f=>db.farmDetails[f]?.active!==false);const farmOpt=()=>options(activeFarms(),'Pilih kandang');const cycleLabel=c=>`${c.farm} · ${c.bird} · ${c.start}`;const cycleOpt=(placeholder='Pilih periode')=> (placeholder?`<option value="">${placeholder}</option>`:'')+db.cycles.map(c=>`<option value="${esc(c.id)}">${esc(cycleLabel(c))}</option>`).join('');const linked=(arr,cid)=>arr.filter(x=>x.cycleId===cid);const net=c=>sum(linked(db.sales,c.id),'total')-sum(linked(db.expenses,c.id),'total');const status=c=>{let reports=db.daily.filter(x=>x.cycleId===c.id);let last=reports.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];let gaps=c.closed!==true||c.checked!==true||!last||!last.checked||db.expenses.some(x=>x.cycleId===c.id&&!x.proof);if(gaps)return {text:'Belum terverifikasi',cls:'warn'};let v=net(c);return Math.abs(v)<0.005?{text:'BEP (simulasi)',cls:''}:{text:v>0?'Surplus (simulasi)':'Rugi (simulasi)',cls:v>0?'':'danger'}};const badge=(t,cls='')=>`<span class="pill ${cls}">${esc(t)}</span>`;const section=(title,extra='')=>`<div class="sectionTitle"><h2>${title}</h2>${extra}</div>`;const metric=(label,value,sub='')=>`<div class="card"><span class="muted">${label}</span><b>${value}</b><span class="tiny muted">${sub}</span></div>`;const empty=t=>`<div class="empty">${t}</div>`;const table=(headers,rows)=>`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">${empty('Belum ada data')}</td></tr>`}</tbody></table></div>`;function nav(){const owner=['dashboard','keuangan','kandang','transaksi','laporan','produk','impor','audit'],admin=['input','keuangan','kandang','transaksi','laporan','produk','impor'];const labels={keuangan:'💳 Keuangan',dashboard:'🏠 Dashboard',input:'➕ Input Cepat',kandang:'🐓 Kandang',transaksi:'📋 Transaksi',laporan:'📊 Laporan',impor:'📥 Impor Arsip',produk:'📦 Master Produk',audit:'🔐 Audit'};let links=role==='owner'?owner:admin;if(!links.includes(page))page=links[0];document.getElementById('nav').innerHTML=links.map(p=>`<button class="${page===p?'active':''}" data-nav="${p}">${labels[p]}</button>`).join('')};function dashboard(){let expenses=sum(db.expenses,'total'),sales=sum(db.sales,'total'),cashIn=sum(db.cash.filter(x=>x.type==='masuk'),'amount'),cashOut=sum(db.cash.filter(x=>x.type==='keluar'),'amount');let cycleMissing=db.cycles.filter(c=>status(c).cls==='warn').length;return section('Pengawasan Pemilik',`<button class="big-btn secondary" data-export="csv">⬇ CSV</button>`)+`<div class="buttonrow" style="margin-bottom:12px"><button class="big-btn secondary" data-demo="1">🧪 Isi data simulasi</button></div><div class="notice">🛡️ <b>Status BEP tidak disamakan dengan saldo kas.</b> Semua angka berdasarkan input yang tersedia. Periode tanpa rekonsiliasi tetap <b>Belum Terverifikasi</b>.</div><div class="cards" style="margin-top:14px">${metric('Dana masuk',money(cashIn),'Deposit/penerimaan kas')}${metric('Belanja tercatat',money(expenses),'Pengeluaran operasional')}${metric('Penjualan tercatat',money(sales),'Nilai hasil tangkapan')}${metric('Saldo kas',money(cashIn-cashOut),'Kas masuk − kas keluar')}</div><div class="grid2"><section class="panel"><h3>📍 Status Kandang & Periode</h3>${db.cycles.length?db.cycles.map(c=>`<div class="barrow"><div><strong>${esc(c.farm)}</strong><div class="tiny muted">${esc(c.bird)} · Mulai ${esc(c.start)}</div></div>${badge(status(c).text,status(c).cls)}</div>`).join(''):empty('Belum ada periode. Buat periode pada menu Kandang.')}</section><section class="panel"><h3>🔔 Pengawasan</h3><div class="barrow"><span>Periode belum terverifikasi</span>${badge(cycleMissing+' periode',cycleMissing?'warn':'')}</div><div class="barrow"><span>Laporan harian hari ini</span>${badge(db.daily.filter(x=>x.date===iso()).length+' laporan','')}</div><div class="barrow"><span>Nota belanja tanpa bukti</span>${badge(db.expenses.filter(x=>!x.proof).length+' transaksi',db.expenses.some(x=>!x.proof)?'warn':'')}</div><div class="notice" style="margin-top:13px">Kekurangan laporan harian harus dicek per periode aktif. Hari tanpa transaksi juga perlu konfirmasi dari admin.</div></section></div><section class="panel"><h3>🏪 Saldo Deposit Distributor</h3>${db.distributors.length?db.distributors.map(d=>`<div class="barrow"><b>${esc(d.name)}</b><b>${money(supplierBalance(d.id))}</b></div>`).join(''):empty('Belum ada distributor terdaftar')}</section><section class="panel"><h3>Aktivitas terakhir</h3>${recent()}</section>`}
function recent(){let all=[...db.expenses.map(x=>({date:x.date,title:'Belanja · '+x.product,amount:x.total})),...db.sales.map(x=>({date:x.date,title:'Tangkapan · '+x.buyer,amount:x.total})),...db.cash.map(x=>({date:x.date,title:'Kas · '+x.category,amount:x.amount})),...db.daily.map(x=>({date:x.date,title:'Laporan · '+x.farm,amount:null}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);return all.length?all.map(x=>`<div class="barrow"><div><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.date)}</div></div><strong>${x.amount===null?'✓':money(x.amount)}</strong></div>`).join(''):empty('Aktivitas akan muncul setelah input pertama')}
function input(){let actions=[['expense','🛒','Belanja','Barang, pakan, obat, DOC'],['sale','🚚','Tangkapan','Penjualan ayam'],['cash','💰','Kas / Deposit','Uang masuk dan keluar'],['daily','🐓','Kondisi Ayam','Populasi, kematian, laporan'],['supplier','🏪','Distributor','Deposit dan saldo distributor']];return section('Input Operasional',badge('Mode Admin'))+(activeFarms().length?'':'<div class="notice">Buat nama kandang terlebih dahulu pada menu Kandang.</div>')+`<div class="notice success">Satu admin mencatat semua kandang. Pilih aktivitas, isi data, lalu tekan Simpan.</div><div class="actions" style="margin-top:14px">${actions.map(a=>`<button class="action" data-form="${a[0]}"><span>${a[1]}</span><strong>${a[2]}</strong><small class="muted">${a[3]}</small></button>`).join('')}</div><section class="panel"><h3>${{expense:'🛒 Input Belanja',sale:'🚚 Input Tangkapan',cash:'💰 Kas / Deposit',daily:'🐓 Kondisi Ayam',supplier:'🏪 Distributor & Deposit'}[form]}</h3>${forms()}</section>`}
function forms(){if(form==='supplier')return `<div class="notice">Daftarkan distributor sekali. Deposit merupakan uang muka, bukan biaya. Saat ambil barang, saldo deposit berkurang dan biaya belanja tetap dicatat satu kali.</div><div class="grid2"><form id="supplierForm" class="panel"><h3>Tambah distributor</h3><div class="field"><label>Nama distributor</label><input name="name" required placeholder="Contoh: Distributor Pakan A"></div><button class="big-btn" style="margin-top:10px">+ Simpan Distributor</button></form><form id="depositForm" class="panel"><h3>Setor deposit</h3><div class="field"><label>Distributor</label><select name="supplierId" required><option value="">Pilih distributor</option>${db.distributors.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>Tanggal</label><input type="date" name="date" value="${iso()}" required></div><div class="field"><label>Nominal Rp</label><input name="amount" class="rupiah" type="text" inputmode="numeric" placeholder="5.000.000" required></div><div class="field"><label>Referensi transfer</label><input name="reference" placeholder="Nomor transfer / bukti" required></div><button class="big-btn" style="margin-top:10px">✅ Simpan Deposit & Kas Keluar</button></form></div><h3>Saldo distributor</h3>${table(['Distributor','Total deposit','Pengambilan','Sisa deposit'],db.distributors.map(d=>{let l=db.supplierLedger.filter(x=>x.supplierId===d.id);return `<tr><td>${esc(d.name)}</td><td>${money(sum(l.filter(x=>x.kind==='deposit'),'amount'))}</td><td>${money(sum(l.filter(x=>x.kind==='usage'),'amount'))}</td><td><b>${money(supplierBalance(d.id))}</b></td></tr>`}))}`;if(form==='expense')return multiNotaPanel();
if(form==='sale')return `<form id="saleForm" class="formgrid"><div class="field"><label>Tanggal</label><input type="date" name="date" value="${iso()}" required></div><div class="field"><label>Kandang</label><select name="farm" required>${farmOpt()}</select></div><div class="field"><label>Periode</label><select name="cycleId">${cycleOpt('Belum dikaitkan')}</select></div><div class="field"><label>Pembeli</label><input name="buyer" required placeholder="Nama pembeli"></div><div class="field"><label>Berat tangkapan (kg)</label><input name="kg" type="number" min="0.01" step="any" required></div><div class="field"><label>Harga per kg (Rp)</label><input name="price" class="rupiah" type="text" inputmode="numeric" required placeholder="38.000"></div><div class="field"><label>Jumlah ekor (opsional)</label><input name="birds" type="number" min="0" step="1"></div><div class="field"><label>Status pembayaran</label><select name="payment"><option value="belum">Belum dibayar</option><option value="lunas">Lunas (catat kas secara terpisah)</option></select></div><div class="field wide"><label>Catatan</label><input name="note"></div><button class="big-btn wide">✅ Simpan Tangkapan</button></form>`;
if(form==='cash')return `<form id="cashForm" class="formgrid"><div class="field"><label>Tanggal</label><input type="date" name="date" value="${iso()}" required></div><div class="field"><label>Arus kas</label><select name="type"><option value="masuk">Uang masuk</option><option value="keluar">Uang keluar</option></select></div><div class="field"><label>Kategori</label><select name="category">${options(['deposit owner','pembayaran penjualan','pembayaran belanja','transfer internal','lain'])}</select></div><div class="field"><label>Nominal (Rp)</label><input name="amount" class="rupiah" type="text" inputmode="numeric" required placeholder="1.000.000"></div><div class="field"><label>Kandang (opsional)</label><select name="farm">${options(['Tidak ditentukan',...db.farms])}</select></div><div class="field"><label>Referensi</label><input name="reference" placeholder="No invoice / rekening"></div><div class="field wide"><label>Catatan</label><input name="note"></div><div class="wide help">Kas dicatat terpisah dari biaya dan pendapatan agar deposit tidak dihitung sebagai laba. Pembayaran penjualan dan belanja tidak otomatis dihubungkan di versi prototype.</div><button class="big-btn wide">✅ Simpan Arus Kas</button></form>`;
return `<form id="dailyForm" class="formgrid"><div class="field"><label>Tanggal</label><input type="date" name="date" value="${iso()}" required></div><div class="field"><label>Periode (wajib)</label><select name="cycleId" required>${cycleOpt()}</select></div><div class="field"><label>Jumlah mati hari ini (ekor)</label><input name="dead" type="number" min="0" step="1" value="0" required></div><div class="field"><label>Ayam afkir (ekor)</label><input name="cull" type="number" min="0" step="1" value="0" required></div><div class="field"><label>Pakan digunakan (kg)</label><input name="feed" type="number" min="0" step="any" value="0" required></div><div class="field"><label>Populasi terhitung (ekor)</label><input name="population" type="number" min="0" step="1" required></div><div class="field wide"><label>Catatan kondisi</label><input name="note" placeholder="Normal / sakit / tidak ada kegiatan"></div><label class="checkline wide"><input type="checkbox" name="checked"> Saya sudah memeriksa data harian ini</label><button class="big-btn wide">✅ Kirim Laporan Harian</button></form>`}
function kandang(){return section('Kandang & Periode')+`<div class="notice success">🏠 Nama kandang dibuat terlebih dahulu. Kandang dapat disewa dari pemilik yang berbeda dan digunakan kembali untuk periode ayam berikutnya.</div><div class="grid2"><section class="panel"><h3>➕ Daftarkan kandang sewaan</h3><form id="farmForm" class="formgrid"><div class="field wide"><label>Nama kandang *</label><input name="name" maxlength="65" required placeholder="Contoh: KD Pak Jaya"></div><div class="field"><label>Nama pemilik kandang</label><input name="owner" maxlength="90" placeholder="Pemilik sewa"></div><div class="field"><label>Lokasi / wilayah</label><input name="location" maxlength="120" placeholder="Lokasi kandang"></div><div class="field"><label>Kapasitas (ekor)</label><input name="capacity" type="number" min="0" step="1" placeholder="Opsional"></div><div class="field"><label>Biaya sewa (Rp)</label><input name="rent" type="number" min="0" step="any" placeholder="Opsional"></div><div class="field"><label>Periode sewa</label><select name="rentPeriod">${options(['Belum ditentukan','Per bulan','Per periode','Per tahun','Lainnya'])}</select></div><div class="field wide"><label>Catatan sewa</label><input name="note" maxlength="250" placeholder="Nomor kontak, masa sewa, dll."></div><button class="big-btn wide">✅ Simpan Kandang</button></form><div class="help" style="margin-top:10px">Biaya sewa di sini hanya informasi perjanjian. Agar masuk laporan keuangan, catat pembayarannya melalui Belanja atau Kas sesuai tujuan pencatatan.</div></section><section class="panel"><h3>🏠 Daftar Kandang (${db.farms.length})</h3>${db.farms.length?db.farms.map(f=>{let d=db.farmDetails[f]||{},used=db.cycles.some(c=>c.farm===f);return `<div class="barrow"><div><strong>${esc(f)}</strong> ${d.active===false?badge('Nonaktif','warn'):badge('Aktif')}<div class="tiny muted">Pemilik: ${esc(d.owner||'Belum diisi')} · ${esc(d.location||'Lokasi belum diisi')}</div><div class="tiny muted">${db.cycles.filter(c=>c.farm===f).length} periode · ${d.rent?('Sewa '+money(d.rent)+' / '+esc(d.rentPeriod||'periode')):'Sewa belum ditentukan'}</div></div><button type="button" class="big-btn secondary" data-farmtoggle="${esc(f)}">${d.active===false?'Aktifkan':'Nonaktifkan'}</button></div>`}).join(''):empty('Belum ada kandang. Isi formulir Daftarkan Kandang untuk memulai.')}</section></div><div class="grid2"><section class="panel"><h3>➕ Buat Periode Produksi</h3>${activeFarms().length?`<form id="cycleForm" class="formgrid"><div class="field"><label>Kandang</label><select name="farm" required>${farmOpt()}</select></div><div class="field"><label>Jenis ayam</label><select name="bird">${options(['Ayam Kampung','Ayam Pejantan','Broiler'])}</select></div><div class="field"><label>Tanggal mulai</label><input type="date" name="start" value="${iso()}" required></div><div class="field"><label>Populasi awal</label><input type="number" name="initial" min="1" step="1" required></div><div class="field wide"><label>Catatan</label><input name="note" placeholder="Sumber DOC, target panen"></div><button class="big-btn wide">Simpan Periode</button></form>`:empty('Buat minimal satu kandang aktif terlebih dahulu.')}</section><section class="panel"><h3>📑 Periode Produksi</h3>${db.cycles.length?db.cycles.map(c=>`<div class="barrow"><div><b>${esc(c.farm)} · ${esc(c.bird)}</b><div class="muted tiny">${esc(c.start)} · awal ${fmt(c.initial)} ekor · Selisih ${money(net(c))}</div></div><div style="text-align:right">${badge(status(c).text,status(c).cls)}${role==='owner'?`<div style="margin-top:8px"><button class="big-btn secondary" data-cycle="${esc(c.id)}">Periksa Periode</button></div>`:''}</div></div>`).join(''):empty('Belum ada periode produksi')}</section></div>`}
function transaksi(){let tabs=[['Semua','Semua'],['Belanja','Belanja'],['Tangkapan','Tangkapan'],['Kas','Kas'],['Harian','Harian'],['Distributor','Distributor']];let list=[...db.expenses.map(x=>({...x,kind:'Belanja',name:x.product,amount:x.total})),...db.sales.map(x=>({...x,kind:'Tangkapan',name:x.buyer,amount:x.total})),...db.cash.map(x=>({...x,kind:'Kas',name:x.category,amount:x.amount})),...db.daily.map(x=>({...x,kind:'Harian',name:'Kondisi ayam',amount:0})),...db.supplierLedger.map(x=>({...x,kind:'Distributor',name:(x.kind==='deposit'?'Setor deposit':'Potong deposit')+' · '+(db.distributors.find(d=>d.id===x.supplierId)?.name||'Tidak diketahui'),amount:x.amount}))].filter(x=>filter==='Semua'||x.kind===filter).sort((a,b)=>b.date.localeCompare(a.date));return section('Riwayat Transaksi',`<button class="big-btn secondary" data-export="csv">⬇ Unduh CSV</button>`)+`<div class="tabbar">${tabs.map(t=>`<button class="${filter===t[0]?'active':''}" data-filter="${t[0]}">${t[1]}</button>`).join('')}</div>${correctionPanel()}<section class="panel">${table(['Tanggal','Jenis','Kandang','Keterangan','Nominal','Tindakan'],list.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.farm||'—')}</td><td>${esc(x.name)}</td><td class="num">${x.kind==='Harian'?'—':money(x.amount)}</td><td>${['Belanja','Tangkapan','Kas','Harian'].includes(x.kind)?`<button class="big-btn secondary" data-edit="${esc(x.kind+'|'+x.id)}">✏️ Koreksi</button>`:'—'}</td></tr>`))}</section>`}
function laporan(){let exp=sum(db.expenses,'total'),rev=sum(db.sales,'total');let report=`<div class="notice">Laporan ini menghitung <b>catatan yang sudah dimasukkan</b>. Selisih pendapatan-biaya belum otomatis merupakan laba final karena belum ada alokasi stok, utang/piutang, depresiasi, dan rekonsiliasi penuh.</div><div class="cards" style="margin-top:12px">${metric('Penjualan',money(rev))}${metric('Biaya tercatat',money(exp))}${metric('Selisih sementara',money(rev-exp))}${metric('Periode',fmt(db.cycles.length))}</div>`;return section('Laporan & Rekap',`<div class="buttonrow"><button class="big-btn secondary" data-export="csv">⬇ CSV</button><button class="big-btn secondary" data-print="1">🖨 Cetak / PDF</button></div>`)+report+`<section class="panel"><h3>Rekap Pengeluaran per Kandang</h3>${table(['Kandang','Belanja','Penjualan','Selisih tercatat'],db.farms.map(f=>{let e=sum(db.expenses.filter(x=>x.farm===f),'total'),s=sum(db.sales.filter(x=>x.farm===f),'total');return `<tr><td>${esc(f)}</td><td class="num">${money(e)}</td><td class="num">${money(s)}</td><td class="num">${money(s-e)}</td></tr>`}))}</section><section class="panel"><h3>Saldo Deposit Distributor</h3>${table(['Distributor','Saldo tersedia'],db.distributors.map(d=>`<tr><td>${esc(d.name)}</td><td class="num">${money(supplierBalance(d.id))}</td></tr>`))}</section><section class="panel"><h3>Riwayat Laporan Harian</h3>${table(['Tanggal','Kandang','Mati','Pakan (kg)','Populasi'],db.daily.map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.farm)}</td><td>${fmt(d.dead)}</td><td>${fmt(d.feed)}</td><td>${fmt(d.population)}</td></tr>`))}</section>`}

const get=fd=>Object.fromEntries(fd.entries());const goodNum=(s,positive=false)=>s!==''&&Number.isFinite(Number(s))&&(positive?Number(s)>0:Number(s)>=0);function addExpense(x){let price=parseRp(x.price),qty=Number(x.quantity),total=qty*price;if(!goodNum(x.quantity,true)||!Number.isFinite(price)||price<0||!Number.isFinite(total)||!x.product.trim())return toast('Jumlah, produk dan harga harus valid');if(!db.farms.includes(x.farm))return toast('Pilih kandang yang valid');if(x.cycleId){let c=db.cycles.find(c=>c.id===x.cycleId);if(!c||c.farm!==x.farm)return toast('Periode harus sesuai kandang');}if(x.paymentSource==='supplier'){let d=db.distributors.find(d=>d.id===x.supplierId);if(!d)return toast('Pilih distributor');if(supplierBalance(d.id)<total)return toast('Saldo deposit distributor tidak mencukupi');}let expenseId=id();db.expenses.unshift({id:expenseId,date:x.date,farm:x.farm,cycleId:x.cycleId,category:x.category,product:x.product,unit:x.unit,quantity:qty,price,total,nota:x.nota,proof:x.proof,note:x.note,paymentSource:x.paymentSource,supplierId:x.paymentSource==='supplier'?x.supplierId:''});if(x.paymentSource==='supplier')db.supplierLedger.unshift({id:id(),supplierId:x.supplierId,date:x.date,kind:'usage',amount:total,expenseId,reference:x.nota||expenseId});audit('Input belanja',`${x.farm}: ${x.product} ${money(total)} (${x.paymentSource})`);persist();toast('Belanja '+money(total)+' berhasil dicatat');render()}
function addSupplier(x){let name=(x.name||'').trim();if(!name)return toast('Nama distributor wajib diisi');if(db.distributors.some(d=>d.name.toLowerCase()===name.toLowerCase()))return toast('Distributor sudah terdaftar');db.distributors.push({id:id(),name});audit('Tambah distributor',name);persist();toast('Distributor ditambahkan');render()}
function addDeposit(x){let amount=parseRp(x.amount);if(!db.distributors.some(d=>d.id===x.supplierId)||!Number.isFinite(amount)||amount<=0||!x.reference.trim())return toast('Periksa distributor, nominal, dan bukti transfer');let ledgerId=id();db.supplierLedger.unshift({id:ledgerId,supplierId:x.supplierId,kind:'deposit',date:x.date,amount,reference:x.reference});db.cash.unshift({id:id(),date:x.date,type:'keluar',category:'deposit distributor',amount,farm:'Tidak ditentukan',reference:x.reference,note:'Transfer uang muka distributor; ledger '+ledgerId});audit('Deposit distributor',money(amount)+' · '+x.reference);persist();toast('Deposit '+money(amount)+' tersimpan');render()}
function addSale(x){if(!goodNum(x.kg,true)||!Number.isFinite(parseRp(x.price))||parseRp(x.price)<0||!x.buyer.trim())return toast('Periksa pembeli, berat dan harga');db.sales.unshift({id:id(),date:x.date,farm:x.farm,cycleId:x.cycleId,buyer:x.buyer,kg:Number(x.kg),price:parseRp(x.price),total:Number(x.kg)*parseRp(x.price),birds:val(x.birds),payment:x.payment,note:x.note});audit('Input tangkapan',`${x.farm}: ${x.buyer}`);persist();toast('Tangkapan berhasil dicatat');render()}
function addCash(x){if(x.category==='deposit distributor')return toast('Gunakan menu Distributor untuk setor deposit');if(!Number.isFinite(parseRp(x.amount))||parseRp(x.amount)<=0)return toast('Nominal harus lebih dari nol');db.cash.unshift({id:id(),date:x.date,type:x.type,category:x.category,amount:parseRp(x.amount),farm:x.farm,reference:x.reference,note:x.note});audit('Input kas',`${x.type} ${money(x.amount)}`);persist();toast('Kas berhasil dicatat');render()}
function addDaily(x){let c=db.cycles.find(c=>c.id===x.cycleId);if(!c)return toast('Buat dan pilih periode terlebih dahulu');if(!['dead','cull','feed','population'].every(k=>goodNum(x[k])))return toast('Jumlah ayam dan pakan harus valid');if(db.daily.some(d=>d.date===x.date&&d.cycleId===x.cycleId))return toast('Laporan tanggal/periode ini sudah ada');db.daily.unshift({id:id(),date:x.date,cycleId:x.cycleId,farm:c.farm,dead:Number(x.dead),cull:Number(x.cull),feed:Number(x.feed),population:Number(x.population),checked:x.checked==='on',note:x.note});audit('Laporan harian',`${c.farm}: ${x.date}`);persist();toast('Laporan harian terkirim');render()}
function addFarm(x){let name=(x.name||'').trim().replace(/\s+/g,' ');if(!name||name.length>65)return toast('Nama kandang wajib diisi (maks. 65 karakter)');if(db.farms.some(f=>f.toLocaleLowerCase('id-ID')===name.toLocaleLowerCase('id-ID')))return toast('Nama kandang sudah terdaftar');if(x.capacity&&!goodNum(x.capacity)||x.rent&&!goodNum(x.rent))return toast('Kapasitas dan sewa harus angka positif');db.farms.push(name);db.farmDetails[name]={owner:(x.owner||'').trim(),location:(x.location||'').trim(),capacity:val(x.capacity),rent:val(x.rent),rentPeriod:x.rentPeriod,note:(x.note||'').trim(),active:true};audit('Tambah kandang',name+' · pemilik '+(x.owner||'belum diisi'));persist();toast('Kandang berhasil ditambahkan');render()}
function addCycle(x){if(!activeFarms().includes(x.farm))return toast('Pilih kandang aktif terlebih dahulu');if(!goodNum(x.initial,true)||!Number.isInteger(Number(x.initial)))return toast('Populasi harus bilangan bulat positif');db.cycles.unshift({id:id(),farm:x.farm,bird:x.bird,start:x.start,year:Number(String(x.start).slice(0,4)),periodNumber:(db.cycles.filter(c=>c.farm===x.farm&&String(c.start).slice(0,4)===String(x.start).slice(0,4)).length+1),initial:Number(x.initial),note:x.note,closed:false,checked:false});audit('Buat periode',`${x.farm} ${x.bird}`);persist();toast('Periode berhasil dibuat');render()}
const csvCell=s=>'"'+String(s??'').replace(/"/g,'""')+'"';function download(content,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportCsv(){let rows=[['jenis','tanggal','kandang','periode','keterangan','jumlah','satuan','nominal'],...db.expenses.map(x=>['Belanja',x.date,x.farm,x.cycleId,x.product,x.quantity,x.unit,x.total]),...db.sales.map(x=>['Tangkapan',x.date,x.farm,x.cycleId,x.buyer,x.kg,'kg',x.total]),...db.cash.map(x=>['Kas '+x.type,x.date,x.farm,'',x.category,1,'transaksi',x.amount]),...db.supplierLedger.map(x=>['Distributor '+x.kind,x.date,'','',db.distributors.find(d=>d.id===x.supplierId)?.name||'',1,'transaksi',x.amount]),...db.daily.map(x=>['Harian',x.date,x.farm,x.cycleId,'Mati '+x.dead+'; pakan '+x.feed+' kg',x.population,'ekor',''])];download('\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'Chegalluss_Laporan_'+iso()+'.csv','text/csv;charset=utf-8')}

function sampleDemo(){let c1={id:id(),farm:'KD Toto',bird:'Ayam Kampung',start:'2026-10-01',initial:1000,closed:false,checked:false},c2={id:id(),farm:'KD Suncang',bird:'Ayam Pejantan',start:'2026-10-05',initial:1500,closed:false,checked:false};let existingFarms=[...db.farms],existingDetails={...db.farmDetails};db=sample();db.farms=[...new Set([...existingFarms,...historicalFarms])];db.farmDetails=existingDetails;db.cycles=[c1,c2];db.expenses=[{id:id(),date:'2026-10-10',farm:'KD Toto',cycleId:c1.id,category:'Pakan',product:'Chick AB',unit:'sak',quantity:10,price:443000,total:4430000,nota:'DEMO-1',proof:'Ada, disimpan fisik',note:'Contoh fiktif'}];db.sales=[{id:id(),date:'2026-10-26',farm:'KD Toto',cycleId:c1.id,buyer:'Pembeli Demo',kg:100,price:40000,total:4000000,birds:70,payment:'lunas',note:'Contoh fiktif'}];db.cash=[{id:id(),date:'2026-10-01',farm:'KD Toto',type:'masuk',category:'deposit owner',amount:10000000,reference:'DEMO',note:'Contoh fiktif'},{id:id(),date:'2026-10-10',farm:'KD Toto',type:'keluar',category:'pembayaran belanja',amount:4430000,reference:'DEMO-1',note:'Contoh fiktif'}];db.demo=true;audit('Aktifkan simulasi','Data demo fiktif ditambahkan');persist();render()}
document.addEventListener('input',e=>{let el=e.target;if(el.classList.contains('rupiah')){let start=el.selectionStart;let digits=el.value.replace(/\D/g,'');el.value=digits?Number(digits).toLocaleString('id-ID'):'';el.setSelectionRange(el.value.length,el.value.length)}let form=el.closest('form');if(form?.id==='expenseForm'){let q=Number(form.elements.quantity?.value),p=parseRp(form.elements.price?.value);let preview=document.getElementById('expensePreview');if(preview)preview.textContent=Number.isFinite(q)&&q>0&&Number.isFinite(p)?'TOTAL: '+money(q*p):'Isi jumlah dan harga satuan';}});document.addEventListener('change',e=>{if(e.target.id==='paymentSource'){let field=document.getElementById('supplierField');if(field)field.style.display=e.target.value==='supplier'?'':'none';}});document.getElementById('role').addEventListener('change',e=>{role=e.target.value;render()});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){page=b.dataset.nav;editTarget=null;render()}if(b.dataset.form){form=b.dataset.form;render()}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.export!==undefined)exportCsv();if(b.dataset.print)window.print();if(b.dataset.backup)backup();if(b.dataset.demo){if(confirm('Isi data simulasi? Ini menggantikan semua data lokal saat ini.'))sampleDemo()}if(b.dataset.reset){if(confirm('Hapus SEMUA data yang tersimpan di browser ini? Cadangkan JSON dulu jika diperlukan.')){db=sample();persist();toast('Data lokal telah dihapus');render()}}if(b.dataset.farmtoggle){let f=b.dataset.farmtoggle;if(!db.farms.includes(f))return;db.farmDetails[f]=db.farmDetails[f]||{};db.farmDetails[f].active=db.farmDetails[f].active===false; audit('Ubah status kandang',f+' · '+(db.farmDetails[f].active?'aktif':'nonaktif'));persist();render()}if(b.dataset.cycle){let c=db.cycles.find(c=>c.id===b.dataset.cycle);if(!c)return;let text=`Periksa status ${cycleLabel(c)}.\n\nSemua biaya, penjualan, piutang/utang, stok dan panen direkonsiliasi?`;if(confirm(text)){c.checked=true;if(confirm('Periode sudah benar-benar selesai dan stok akhir diperiksa?'))c.closed=true;audit('Pemeriksaan periode',cycleLabel(c));persist();render()}}});document.addEventListener('submit',e=>{if(!['expenseForm','saleForm','cashForm','dailyForm','cycleForm','farmForm','supplierForm','depositForm'].includes(e.target.id))return;e.preventDefault();let x=get(new FormData(e.target));({expenseForm:addExpense,saleForm:addSale,cashForm:addCash,dailyForm:addDaily,cycleForm:addCycle,farmForm:addFarm,supplierForm:addSupplier,depositForm:addDeposit})[e.target.id](x)});

function fieldEdit(label,name,value,type='text',opts=null){const v=String(value??'');return `<div class="field"><label>${esc(label)}</label>${opts?`<select name="${name}">${opts.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${name}" ${type==='money'?'class="rupiah" inputmode="numeric" type="text"':`type="${type}"`} value="${esc(type==='money'?Number(value||0).toLocaleString('id-ID'):v)}" ${['note','nota','reference','proof'].includes(name)?'':'required'}>`}</div>`}

if(kind==='Harian')f+=fieldEdit('Mati','dead',r.dead,'number')+fieldEdit('Afkir','cull',r.cull,'number')+fieldEdit('Pakan (kg)','feed',r.feed,'number')+fieldEdit('Populasi','population',r.population,'number')+fieldEdit('Catatan','note',r.note);
return f}
function correctionPanel(){let pending=db.corrections.filter(x=>x.status==='pending');let area=role==='owner'&&pending.length?`<section class="panel"><h3>🔒 Permohonan Koreksi Menunggu Owner (${pending.length})</h3>${pending.map(c=>`<div class="barrow"><div><b>${esc(c.kind)} · ${esc(c.reason)}</b><div class="tiny muted">${esc(JSON.stringify(c.before))} → ${esc(c.cancel?'BATAL':JSON.stringify(c.after))}</div></div><div class="buttonrow"><button class="big-btn" data-approve="${esc(c.id)}">Setujui</button><button class="big-btn secondary" data-reject="${esc(c.id)}">Tolak</button></div></div>`).join('')}</section>`:'';
if(!editTarget)return area;let r=db[recordMap[editTarget.kind]]?.find(x=>x.id===editTarget.id);if(!r)return area;return area+`<section class="panel" id="correctionBox"><h3>✏️ Koreksi ${esc(editTarget.kind)}</h3><div class="notice">${correctionState(editTarget.kind,r)==='review'?'Laporan telah diperiksa atau periode ditutup. Koreksi membutuhkan persetujuan Owner.':'Perubahan langsung diterapkan dan dicatat dalam riwayat.'} Transaksi asli dan perubahan dicatat di audit lokal.</div><form id="correctionForm" class="formgrid" style="margin-top:12px">${editFields(editTarget.kind,r)}<div class="field wide"><label>Alasan koreksi (wajib)</label><input name="reason" required minlength="5" placeholder="Contoh: salah ketik jumlah pada nota"></div><div class="buttonrow wide"><button class="big-btn">✅ Simpan Koreksi</button><button type="button" class="big-btn dangerbtn" data-cancel-transaction="1">Batalkan Transaksi</button><button type="button" class="big-btn secondary" data-closeedit="1">Tutup</button></div></form></section>`}
function replaceRecord(kind,old,after,cancel){let arr=db[recordMap[kind]];let idx=arr.findIndex(x=>x.id===old.id);if(idx<0)throw Error('Transaksi tidak ditemukan');let changed=cancel?null:{...after};if(kind==='Belanja'){
 let l=db.supplierLedger.find(x=>x.expenseId===old.id);let sid=old.paymentSource==='supplier'?old.supplierId:null;let diff=(changed?changed.total:0)-old.total;
 if(sid && supplierBalance(sid)<diff)throw Error('Saldo distributor tidak mencukupi untuk koreksi');
 if(l){if(changed){l.amount=changed.total;l.date=changed.date;l.reference=changed.nota||changed.id;}else db.supplierLedger=db.supplierLedger.filter(x=>x!==l)}
 else if(sid&&changed){db.supplierLedger.unshift({id:id(),supplierId:sid,date:changed.date,kind:'usage',amount:changed.total,expenseId:old.id,reference:changed.nota||old.id})}
 }
 if(kind==='Tangkapan'){let l=db.supplierLedger.find(x=>x.saleId===old.id);if(l){if(cancel){db.supplierLedger=db.supplierLedger.filter(x=>x!==l)}else{l.amount=changed.total;l.date=changed.date;l.reference=changed.reference||changed.id;}}}if(cancel)arr.splice(idx,1);else arr[idx]=changed;
 if(kind==='Harian'&&changed){changed.checked=false;let c=db.cycles.find(x=>x.id===changed.cycleId);if(c){c.checked=false;c.closed=false}}
 else if(changed){let c=db.cycles.find(x=>x.id===changed.cycleId);if(c){c.checked=false;c.closed=false}}
}
function submitCorrection(raw,cancel=false){if(!editTarget)return;let {kind,id:recId}=editTarget;let r=db[recordMap[kind]]?.find(x=>x.id===recId);if(!r)return toast('Transaksi tidak ada');let reason=(raw.reason||'').trim();if(reason.length<5)return toast('Alasan koreksi minimal 5 karakter');let after={...r};if(!cancel){for(let key of Object.keys(r)){if(Object.prototype.hasOwnProperty.call(raw,key))after[key]=raw[key]};if(!/^\d{4}-\d{2}-\d{2}$/.test(after.date))return toast('Tanggal tidak valid');if(kind==='Belanja'){after.quantity=Number(raw.quantity);after.price=parseRp(raw.price);after.total=after.quantity*after.price;if(!(after.quantity>0&&Number.isFinite(after.total)&&after.price>=0&&after.product.trim()))return toast('Jumlah dan harga tidak valid');if(!db.farms.includes(after.farm)||after.cycleId&&db.cycles.find(x=>x.id===after.cycleId)?.farm!==after.farm)return toast('Kandang dan periode tidak sesuai')}
 if(kind==='Tangkapan'){after.kg=Number(raw.kg);after.birds=Number(raw.birds);after.price=parseRp(raw.price);after.total=after.kg*after.price;if(!(after.kg>0&&Number.isFinite(after.total)&&after.price>=0&&after.birds>=0&&Number.isInteger(after.birds)))return toast('Berat, ekor, harga tidak valid');if(after.cycleId&&db.cycles.find(x=>x.id===after.cycleId)?.farm!==after.farm)return toast('Kandang tidak cocok dengan periode')}
 if(kind==='Kas'){after.amount=parseRp(raw.amount);if(!(after.amount>0&&Number.isFinite(after.amount)))return toast('Nominal kas tidak valid')}
 if(kind==='Harian'){for(let k of ['dead','cull','feed','population'])after[k]=Number(raw[k]);if(!['dead','cull','feed','population'].every(k=>Number.isFinite(after[k])&&after[k]>=0)||!['dead','cull','population'].every(k=>Number.isInteger(after[k])))return toast('Data populasi tidak valid');if(db.daily.some(x=>x.id!==r.id&&x.cycleId===r.cycleId&&x.date===after.date))return toast('Laporan hari itu sudah ada')}
 }
 let req={id:id(),kind,recordId:recId,before:structuredClone(r),after:cancel?null:structuredClone(after),cancel,reason,status:'pending',created:new Date().toISOString()};
 if(correctionState(kind,r)==='review'){db.corrections.unshift(req);audit('Permintaan koreksi',kind+' · '+reason);persist();editTarget=null;render();toast('Menunggu persetujuan Owner');return}
 try{replaceRecord(kind,r,after,cancel)}catch(e){return toast(e.message)}req.status='applied';db.corrections.unshift(req);audit(cancel?'Batalkan transaksi':'Koreksi transaksi',kind+' · '+reason+' · '+JSON.stringify(r)+' => '+JSON.stringify(after));persist();editTarget=null;render();toast('Koreksi tersimpan')}
function decideCorrection(requestId,approve){if(role!=='owner')return;let c=db.corrections.find(x=>x.id===requestId&&x.status==='pending');if(!c)return;let r=db[recordMap[c.kind]]?.find(x=>x.id===c.recordId);if(!r){toast('Transaksi sudah berubah. Pemeriksaan manual diperlukan');return}if(JSON.stringify(r)!==JSON.stringify(c.before)){toast('Data sumber berubah. Permohonan tidak bisa diterapkan');return}if(approve){try{replaceRecord(c.kind,r,c.after,c.cancel)}catch(e){return toast(e.message)}}c.status=approve?'approved':'rejected';c.reviewed=new Date().toISOString();audit(approve?'Setujui koreksi':'Tolak koreksi',c.kind+' · '+c.reason);persist();render();toast(approve?'Koreksi disetujui':'Koreksi ditolak')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.edit){let [kind,id]=b.dataset.edit.split('|');if(!recordMap[kind])return;let r=db[recordMap[kind]]?.find(x=>x.id===id);if(!r)return;if(kind==='Kas'&&r.category==='deposit distributor')return toast('Setoran distributor tidak dapat diedit dari Kas; buat transaksi penyesuaian terpisah');editTarget={kind,id};render();document.getElementById('correctionBox')?.scrollIntoView({behavior:'smooth',block:'start'})}if(b.dataset.closeedit){editTarget=null;render()}if(b.dataset.cancelTransaction){let reason=document.querySelector('#correctionForm [name=reason]')?.value||'';if(!confirm('Batalkan transaksi ini? Alasannya wajib diisi dan tersimpan dalam audit.'))return;submitCorrection({reason},true)}if(b.dataset.approve)decideCorrection(b.dataset.approve,true);if(b.dataset.reject)decideCorrection(b.dataset.reject,false)});
document.addEventListener('submit',e=>{if(e.target.id!=='correctionForm')return;e.preventDefault();submitCorrection(Object.fromEntries(new FormData(e.target))) });

 <section class="panel"><h3>1. Cadangkan data yang sedang ada</h3><button class="big-btn secondary" data-backup="1">⬇ Cadangkan database JSON</button><p class="muted tiny">Simpan cadangan di perangkat Anda sebelum menguji.</p></section>

function historyPreview(h){return `<div class="cards" style="margin-top:12px">${metric('Belanja valid',h.expenses.length+' baris')}${metric('Total belanja',money(h.expenses.reduce((t,x)=>t+x.total,0)))}${metric('Tangkapan terinci',h.sales.length+' baris')}${metric('Perlu verifikasi',h.review.length+' baris')}</div><p class="tiny muted">Tangkapan yang tidak diketahui asal kandangnya diberi label Belum dialokasikan; ringkasan setoran bukan transaksi otomatis.</p><button class="big-btn" data-runimport="1">📥 Impor ke database lokal</button>`}
function validateImport(h){
 if(h?.format!=='chegalluss-historical-v1'||!Array.isArray(h.expenses)||!Array.isArray(h.sales)||!Array.isArray(h.review))throw Error('Format file impor tidak cocok');
 if(h.expenses.length>10000||h.sales.length>10000)throw Error('File terlalu besar');
 for(let x of h.expenses){if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!x.farm||!x.product||!Number.isFinite(x.quantity)||x.quantity<=0||!Number.isSafeInteger(x.price)||!Number.isSafeInteger(x.total)||Math.abs(x.quantity*x.price-x.total)>0.51||!Number.isInteger(x.page)||!Number.isInteger(x.row))throw Error('Data belanja tidak valid');}
 for(let x of h.sales){if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!x.buyer||!(x.kg>0)||!Number.isSafeInteger(x.price)||!Number.isSafeInteger(x.total)||Math.abs(x.kg*x.price-x.total)>0.51||!Number.isInteger(x.row))throw Error('Data tangkapan tidak valid');}
 return true;
}
function runHistoricalImport(){let h=importStaged;if(!h)return toast('Pilih file impor terlebih dahulu');try{validateImport(h)}catch(e){return toast(e.message)}
 if(!confirm('Impor arsip historis ke data lokal? Data yang ada dipertahankan. Disarankan sudah mengunduh cadangan.'))return;
 let added=0,skipped=0;
 for(let x of h.expenses){let rid='hist-exp-'+x.page+'-'+x.row;if(db.expenses.some(e=>e.id===rid)){skipped++;continue}if(!db.farms.includes(x.farm)){db.farms.push(x.farm);db.farmDetails[x.farm]??={owner:'',location:'',capacity:0,rent:0,rentPeriod:'',active:false,note:'Nama kandang dari arsip PDF'}}
 let category=x.category==='Mpan'?'Pakan':cats.includes(x.category)?x.category:'Lainnya';db.expenses.push({id:rid,date:x.date,farm:x.farm,cycleId:'',category,product:x.product,unit:'unit (perlu verifikasi)',quantity:x.quantity,price:x.price,total:x.total,nota:'',proof:'Arsip PDF '+x.page, note:'ARSIP HISTORIS · Laporan Rincian Belanja.pdf · halaman '+x.page+' baris '+x.row+(x.note?' · '+x.note:''),paymentSource:'historical_unverified',supplierId:''});added++}
 let salesAdded=0;
 for(let x of h.sales){let rid='hist-sale-'+x.page+'-'+x.row;if(db.sales.some(e=>e.id===rid))continue;db.sales.push({id:rid,date:x.date,farm:'Belum dialokasikan',cycleId:'',buyer:x.buyer,kg:x.kg,price:x.price,total:x.total,birds:0,payment:'belum diverifikasi',note:'ARSIP HISTORIS · Tangkapan 1.pdf · halaman '+x.page+' baris '+x.row+' · kandang belum diketahui'});salesAdded++}
 db.historicalReview=h.review;db.historicalImportMeta=h.metadata;db.demo=false;audit('Impor arsip PDF',added+' belanja; '+salesAdded+' tangkapan; '+skipped+' belanja dilewati sebagai duplikat; '+h.review.length+' butuh verifikasi');persist();importStaged=null;render();toast('Impor: '+added+' belanja dan '+salesAdded+' tangkapan. '+h.review.length+' baris perlu verifikasi')
}
document.addEventListener('change',async e=>{if(e.target.id!=='historyFile')return;try{let t=await e.target.files[0].text();let h=JSON.parse(t);validateImport(h);importStaged=h;document.getElementById('historyPreview').innerHTML=historyPreview(h)}catch(err){importStaged=null;document.getElementById('historyPreview').textContent='File tidak valid: '+err.message}});

function productPriceRows(){return db.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{let h=priceHistoryFor(p.name),now=latestPriceFor(p),prior=h.length>1?Number(h[h.length-2].price):null;let trend=prior===null?'Belum ada perbandingan':now>prior?'▲ Naik '+money(now-prior):now<prior?'▼ Turun '+money(prior-now):'Tetap';return `<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(now)}</td><td>${esc(trend)}</td><td>${h.length} pembelian</td></tr>`})}
function productsPage(){return section('Master Produk')+`<div class="notice">Harga master merupakan cadangan awal; saat barang pernah dibeli, harga terakhir dari transaksi dipakai untuk bon selanjutnya. Riwayat harga mengikuti nota tersimpan dan tidak mengubah nota sebelumnya. Referensi tersedia dari file Excel Ci Noni, tidak diimpor otomatis agar tidak mengganggu data aktif.</div><div class="buttonrow"><button class="big-btn secondary" data-seedproducts="1">📦 Muat referensi produk Ci Noni (${ciNoniProducts.length})</button></div><section class="panel"><h3>Tambah / perbarui produk</h3><form id="productMasterForm" class="formgrid"><div class="field"><label>Nama produk</label><input name="name" required placeholder="Chick AB"></div><div class="field"><label>Kategori</label><select name="category">${options(cats)}</select></div><div class="field"><label>Satuan</label><select name="unit">${options(['sak','ekor','botol','kg','pcs','dosis','unit','lainnya'])}</select></div><div class="field"><label>Harga awal Rp</label><input name="price" class="rupiah" inputmode="numeric" required placeholder="450.000"></div><button class="big-btn wide">Simpan Master Produk</button></form></section><section class="panel"><h3>Daftar Produk (${db.products.length})</h3>${table(['Produk','Kategori','Harga terakhir','Perubahan terakhir','Riwayat'],productPriceRows())}</section>`}
function notaRow(i){return `<div class="nota-row" data-row="${i}" style="border:1px solid var(--line,#ddd);border-radius:12px;padding:10px;margin:8px 0"><div class="formgrid"><div class="field"><label>Produk</label><select class="n-product">${productOptions()}</select></div><div class="field"><label>Nama barang (bisa manual)</label><input class="n-name" required placeholder="Nama barang"></div><div class="field"><label>Kategori</label><select class="n-category">${options(cats)}</select></div><div class="field"><label>Satuan</label><select class="n-unit">${options(['sak','ekor','botol','kg','pcs','dosis','unit','lainnya'])}</select></div><div class="field"><label>Jumlah</label><input class="n-qty" type="number" min="0.01" step="any" required value="1"></div><div class="field"><label>Harga satuan Rp</label><input class="n-price rupiah" inputmode="numeric" required placeholder="450.000"></div></div><div class="barrow"><b class="n-total">Rp0</b><button type="button" class="big-btn secondary" data-removerow="${i}">Hapus item</button></div></div>`}
let notaRowCounter=1;
function multiNotaPanel(){return `<section class="panel"><h3>🧾 Pembelian • Satu Form per Bon</h3><p class="muted tiny">Satu bon untuk satu kandang. Tambahkan beberapa barang bila perlu. Harga terakhir terisi otomatis dari riwayat dan dapat diganti. Pilih deposit Ci Noni bila menggunakan saldo distributor.</p><form id="notaForm"><div class="formgrid"><div class="field"><label>Tanggal</label><input name="date" type="date" value="${iso()}" required></div><div class="field"><label>Kandang</label><select name="farm" required>${farmOpt()}</select></div><div class="field"><label>Periode produksi (opsional)</label><select name="cycleId">${cycleOpt('Tidak terkait periode')}</select></div><div class="field"><label>Nomor Nota (wajib)</label><input name="nota" required placeholder="BON-001"></div><div class="field"><label>Pembayaran</label><select name="paymentSource" id="notaPayment"><option value="pending">Belum dibayar / utang</option><option value="supplier">Potong deposit distributor</option><option value="cash">Bayar dari kas operasional (pencatatan kas terpisah)</option></select></div><div class="field"><label>Distributor (jika deposit)</label><select name="supplierId"><option value="">Pilih distributor</option>${db.distributors.map(d=>`<option value="${esc(d.id)}">${esc(d.name)} (${money(supplierBalance(d.id))})</option>`).join('')}</select></div><div class="field wide"><label>Bukti</label><select name="proof"><option value="">Belum ada</option><option value="Ada, disimpan fisik">Nota fisik tersedia</option><option value="Ada, dokumentasi terpisah">Dokumentasi terpisah</option></select></div></div><div id="notaRows">${notaRow(0)}</div><div class="buttonrow"><button type="button" class="big-btn secondary" data-addrow="1">+ Tambah barang</button></div><div class="notice success" style="margin:10px 0">TOTAL NOTA: <b id="notaTotal">Rp0</b><div class="tiny muted" id="notaWarning"></div></div><button class="big-btn" type="submit">✅ Simpan semua barang dalam nota</button></form></section>`}
function notaLines(form){return [...form.querySelectorAll('.nota-row')].map(row=>({name:row.querySelector('.n-name').value.trim(),category:row.querySelector('.n-category').value,unit:row.querySelector('.n-unit').value,quantity:Number(row.querySelector('.n-qty').value),price:parseRp(row.querySelector('.n-price').value)}))}
function notaUpdate(){let f=document.getElementById('notaForm');if(!f)return;let items=notaLines(f);let total=items.reduce((a,x)=>a+(Number.isFinite(x.quantity*x.price)?x.quantity*x.price:0),0);document.getElementById('notaTotal').textContent=money(total);let warning=items.map((x,i)=>{let prev=db.expenses.filter(e=>e.product.toLowerCase()===x.name.toLowerCase()&&e.price>0).slice(-15).map(e=>e.price).sort((a,b)=>a-b);let p=prev.length?prev[Math.floor(prev.length/2)]:0;return p&&x.price>p*1.5?'Item '+(i+1)+' harga >150% median riwayat':(p&&x.price!==p?'Item '+(i+1)+' harga berubah dari '+money(p)+' ke '+money(x.price):'')}).filter(Boolean);document.getElementById('notaWarning').textContent=warning.join(' | ')||'Cek jumlah, satuan dan harga sebelum simpan.'}
function submitNota(f){let x=get(new FormData(f));let lines=notaLines(f);if(!db.farms.includes(x.farm)||!x.nota.trim())return toast('Pilih kandang dan nomor nota');if(x.cycleId&&db.cycles.find(c=>c.id===x.cycleId)?.farm!==x.farm)return toast('Periode tidak cocok dengan kandang');if(!lines.length||lines.some(l=>!l.name||!Number.isFinite(l.quantity)||l.quantity<=0||!Number.isSafeInteger(l.price)||l.price<0||!Number.isSafeInteger(l.quantity*l.price)))return toast('Periksa nama, jumlah dan harga tiap item');let total=lines.reduce((a,l)=>a+l.quantity*l.price,0);if(!Number.isSafeInteger(total))return toast('Total nota terlalu besar');if(x.paymentSource==='supplier'&&(!db.distributors.some(d=>d.id===x.supplierId)||supplierBalance(x.supplierId)<total))return toast('Distributor atau saldo deposit tidak mencukupi');if(db.notaGroups.some(n=>n.nota===x.nota&&n.farm===x.farm&&n.date===x.date))return toast('Nomor nota yang sama sudah tercatat pada tanggal dan kandang ini');let notaId=id(),when=x.date;let items=lines.map((l,i)=>({id:id(),notaGroupId:notaId,date:when,farm:x.farm,cycleId:x.cycleId,category:l.category,product:l.name,unit:l.unit,quantity:l.quantity,price:l.price,total:l.quantity*l.price,nota:x.nota,proof:x.proof,note:'Nota gabungan · item '+(i+1),paymentSource:x.paymentSource,supplierId:x.paymentSource==='supplier'?x.supplierId:''}));db.expenses.unshift(...items);for(const l of lines){let pm=db.products.find(p=>p.name.toLowerCase()===l.name.toLowerCase());if(pm){pm.price=l.price;pm.category=l.category;pm.unit=l.unit}else db.products.push({id:id(),name:l.name,category:l.category,unit:l.unit,price:l.price})}db.notaGroups.unshift({id:notaId,nota:x.nota,farm:x.farm,date:x.date,itemIds:items.map(z=>z.id)});if(x.paymentSource==='supplier')for(let item of items)db.supplierLedger.unshift({id:id(),supplierId:x.supplierId,date:when,kind:'usage',amount:item.total,expenseId:item.id,reference:x.nota});audit('Input nota gabungan',x.farm+' · '+x.nota+' · '+lines.length+' barang · '+money(total));persist();render();toast('Nota '+x.nota+' tersimpan: '+money(total))}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.seedproducts){let added=0;for(let p of ciNoniProducts){if(db.products.some(q=>q.name.toLowerCase()===p.name.toLowerCase()))continue;db.products.push({id:id(),name:p.name,category:categoryFromNumbers(p.category),unit:p.unit,price:p.price});added++}audit('Muat referensi produk Ci Noni',added+' produk');persist();render();toast(added+' produk referensi ditambahkan')}if(b.dataset.addrow){document.getElementById('notaRows')?.insertAdjacentHTML('beforeend',notaRow(notaRowCounter++));notaUpdate()}if(b.dataset.removerow){let rows=document.querySelectorAll('#notaRows .nota-row');if(rows.length===1)return toast('Minimal satu barang');b.closest('.nota-row')?.remove();notaUpdate()}});
document.addEventListener('change',e=>{if(e.target.matches('.n-product')){let row=e.target.closest('.nota-row'),p=productById(e.target.value);if(p){row.querySelector('.n-name').value=p.name;row.querySelector('.n-category').value=p.category;row.querySelector('.n-unit').value=p.unit;row.querySelector('.n-price').value=latestPriceFor(p).toLocaleString('id-ID')}notaUpdate()}if(e.target.matches('#expenseForm [name=product]')){let f=e.target.form,p=db.products.find(p=>p.name.toLowerCase()===e.target.value.toLowerCase());if(p){f.elements.category.value=p.category;f.elements.unit.value=p.unit;f.elements.price.value=p.price.toLocaleString('id-ID');f.elements.price.dispatchEvent(new Event('input',{bubbles:true}))}}});
document.addEventListener('input',e=>{if(e.target.closest('#notaForm'))notaUpdate()});
document.addEventListener('submit',e=>{if(e.target.id==='notaForm'){e.preventDefault();submitNota(e.target)}if(e.target.id==='productMasterForm'){e.preventDefault();let x=get(new FormData(e.target)),price=parseRp(x.price),name=x.name.trim();if(!name||!Number.isSafeInteger(price)||price<0)return toast('Periksa master produk');let p=db.products.find(p=>p.name.toLowerCase()===name.toLowerCase());if(p){p.price=price;p.category=x.category;p.unit=x.unit}else db.products.push({id:id(),name,category:x.category,unit:x.unit,price});audit('Master produk',name+' · '+money(price));persist();render();toast('Master produk tersimpan')}});


// v1.7: financial sub-ledgers. Prototype only, no true server-side authorisation.
const supplierName=sid=>db.distributors.find(d=>d.id===sid)?.name||'(Tidak ditemukan)';
const advanceBalance=name=>db.advances.filter(a=>a.employee===name).reduce((v,a)=>v+(a.kind==='give'?a.amount:-a.amount),0);
const advanceNames=()=>[...new Set(db.advances.map(a=>a.employee))].sort();
function keuangan(){let si=db.distributors.map(d=>{let rows=db.supplierLedger.filter(x=>x.supplierId===d.id).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));let balance=0;return {d,rows:rows.map(x=>({...x,running:(balance+=((x.kind==='deposit'||x.kind==='sale_credit')?x.amount:-x.amount))}))}});let sourceOpts='<option value="">Pilih distributor</option>'+db.distributors.map(d=>`<option value="${esc(d.id)}">${esc(d.name)} (${money(supplierBalance(d.id))})</option>`).join('');let admin=role==='admin';return section('Keuangan · Deposit, Kas, Kasbon')+`<div class="notice">🏪 <b>1 saldo per distributor untuk semua kandang.</b> Bon pembelian dibebankan ke kandang/periode terkait. Penjualan ayam kepada distributor dapat menambah deposit. Transfer deposit bukan biaya produksi; kasbon bukan biaya gaji saat diberikan.</div><div class="cards">${metric('Saldo Ci Noni / distributor',money(db.distributors.reduce((a,d)=>a+supplierBalance(d.id),0)),'Seluruh distributor')}${metric('Kasbon belum dilunasi',money(advanceNames().reduce((a,n)=>a+advanceBalance(n),0)),'Piutang karyawan')}${metric('Kas tercatat',money(sum(db.cash.filter(c=>c.type==='masuk'),'amount')-sum(db.cash.filter(c=>c.type==='keluar'),'amount')),'Saldo catatan kas; belum rekonsiliasi bank')}</div>${admin?`<div class="grid2"><section class="panel"><h3>🚚 Panen dibayar ke deposit</h3><div class="tiny muted">Membuat penjualan baru dan satu kredit pada rekening distributor. Jangan mencatat penjualan yang sama lagi di menu Tangkapan.</div><form id="creditSaleForm" class="formgrid"><div class="field"><label>Tanggal</label><input type="date" name="date" value="${iso()}" required></div><div class="field"><label>Distributor pembeli</label><select name="supplierId" required>${sourceOpts}</select></div><div class="field"><label>Kandang</label><select name="farm" required>${farmOpt()}</select></div><div class="field"><label>Periode</label><select name="cycleId">${cycleOpt('Tidak terkait periode')}</select></div><div class="field"><label>Berat panen (kg)</label><input name="kg" required type="number" min="0.001" step="any"></div><div class="field"><label>Harga per kg (Rp)</label><input name="price" required inputmode="numeric" class="rupiah" placeholder="38.000"></div><div class="field"><label>Ekor (opsional)</label><input name="birds" type="number" min="0" step="1"></div><div class="field"><label>No. bon panen</label><input name="reference" required placeholder="PANEN-001"></div><button class="big-btn wide">➕ Catat penjualan & kredit deposit</button></form></section><section class="panel"><h3>👥 Kasbon karyawan</h3><div class="tiny muted">Kasbon diberikan dari kas operasional; pengembalian masuk kembali ke kas. Potong gaji dicatat sebagai penyelesaian kasbon tanpa kas masuk baru.</div><form id="advanceForm" class="formgrid"><div class="field"><label>Tanggal</label><input name="date" type="date" value="${iso()}" required></div><div class="field"><label>Nama karyawan</label><input name="employee" required placeholder="Nama karyawan" list="employeesList"><datalist id="employeesList">${advanceNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div><div class="field"><label>Jenis</label><select name="kind"><option value="give">Beri kasbon</option><option value="repay">Pengembalian tunai</option><option value="salary">Potong dari gaji</option></select></div><div class="field"><label>Nominal (Rp)</label><input name="amount" class="rupiah" inputmode="numeric" required placeholder="500.000"></div><div class="field wide"><label>No. bukti / keterangan</label><input name="reference" required placeholder="KB-001"></div><button class="big-btn wide">💾 Simpan kasbon</button></form></section></div>`:'<div class="notice success">Mode Owner: tabel pengawasan di bawah ini bersifat baca saja.</div>'}<section class="panel"><h3>🏪 Rekening koran distributor</h3>${si.length?si.map(({d,rows})=>`<h4>${esc(d.name)} · Saldo ${money(supplierBalance(d.id))}</h4>${table(['Tanggal','Jenis','Referensi','Kandang / Bon','Mutasi','Saldo berjalan'],rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind==='deposit'?'Setor deposit':x.kind==='sale_credit'?'Kredit panen':'Ambil barang')}</td><td>${esc(x.reference||'')}</td><td>${esc(db.expenses.find(e=>e.id===x.expenseId)?.farm||db.sales.find(e=>e.id===x.saleId)?.farm||'—')}</td><td class="num">${x.kind==='usage'?'−':'+'}${money(x.amount)}</td><td class="num">${money(x.running)}</td></tr>`))}`).join(''):empty('Daftarkan distributor di Admin → Input Cepat → Distributor')}</section><section class="panel"><h3>Kasbon per karyawan</h3>${table(['Karyawan','Sisa kasbon'],advanceNames().map(n=>`<tr><td>${esc(n)}</td><td class="num">${money(advanceBalance(n))}</td></tr>`))}${table(['Tanggal','Karyawan','Jenis','Nominal','Bukti'],db.advances.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.employee)}</td><td>${a.kind==='give'?'Diberikan':a.kind==='salary'?'Potong gaji':'Dikembalikan'}</td><td>${money(a.amount)}</td><td>${esc(a.reference)}</td></tr>`))}</section><div class="notice">⚠️ Periode historis, pembayaran sewa/sekam, dan kewajiban yang belum dicatat harus tetap direkonsiliasi sebelum laporan dinyatakan BEP terverifikasi.</div>`}
function saveCreditSale(f){let x=get(new FormData(f));let kg=Number(x.kg),price=parseRp(x.price),total=kg*price;
if(!db.distributors.some(d=>d.id===x.supplierId)||!db.farms.includes(x.farm)||x.cycleId&&db.cycles.find(c=>c.id===x.cycleId)?.farm!==x.farm)return toast('Distributor/kandang/periode tidak valid');
if(!Number.isFinite(kg)||kg<=0||!Number.isSafeInteger(price)||price<=0||!Number.isSafeInteger(total)||total<=0||!x.reference.trim())return toast('Berat, harga, atau bon tidak valid');
if(db.supplierLedger.some(l=>l.supplierId===x.supplierId&&l.kind==='sale_credit'&&l.reference===x.reference))return toast('Nomor bon panen sudah ada di distributor ini');
let sid=id(),sale={id:sid,date:x.date,farm:x.farm,cycleId:x.cycleId,buyer:supplierName(x.supplierId),kg,price,total,birds:val(x.birds),payment:'kredit deposit',reference:x.reference,note:'Panen dikreditkan ke distributor',supplierId:x.supplierId};db.sales.unshift(sale);db.supplierLedger.unshift({id:id(),supplierId:x.supplierId,kind:'sale_credit',amount:total,date:x.date,reference:x.reference,saleId:sid});audit('Panen jadi deposit',x.farm+' '+x.reference+' '+money(total));persist();render();toast('Penjualan dan deposit bertambah '+money(total))}
function saveAdvance(f){let x=get(new FormData(f)),amount=parseRp(x.amount),name=x.employee.trim().replace(/\s+/g,' ');if(!name||!x.reference.trim()||!Number.isSafeInteger(amount)||amount<=0)return toast('Nama, bukti dan nominal harus valid');if(x.kind!=='give'&&advanceBalance(name)<amount)return toast('Pelunasan lebih besar dari saldo kasbon');if(db.advances.some(a=>a.reference===x.reference&&a.employee.toLowerCase()===name.toLowerCase()))return toast('Nomor bukti kasbon sudah dipakai');let aid=id();db.advances.unshift({id:aid,date:x.date,employee:name,kind:x.kind,amount,reference:x.reference});if(x.kind!=='salary')db.cash.unshift({id:id(),date:x.date,type:x.kind==='give'?'keluar':'masuk',category:'kasbon karyawan',amount,farm:'Tidak ditentukan',reference:x.reference,note:'Mutasi kasbon '+aid});audit('Kasbon karyawan',name+' '+x.kind+' '+money(amount));persist();render();toast('Kasbon tersimpan')}
document.addEventListener('submit',e=>{if(e.target.id==='creditSaleForm'||e.target.id==='advanceForm'){e.preventDefault();if(role!=='admin')return toast('Hanya mode Admin');e.target.id==='creditSaleForm'?saveCreditSale(e.target):saveAdvance(e.target)}});

render();
</script></body></html>
