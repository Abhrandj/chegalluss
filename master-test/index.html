<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHEGALLUSS v2.1</title><style>body{font:16px system-ui;background:#f3f5ee;margin:0;color:#1b3327}header{background:#173025;color:white;padding:22px}main{max-width:720px;margin:auto;padding:15px}.card{background:white;border:1px solid #d9e2d8;border-radius:16px;padding:18px;margin:12px 0}label{display:block;margin:10px 0}input,select,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbc9bf;border-radius:9px;font:inherit}button{background:#315b43;color:white;font-weight:bold;border:0;margin:9px 0}.hide{display:none}.error{color:#ad3529}li{padding:8px;border-bottom:1px solid #eee}</style><header><h2>🐓 CHEGALLUSS CONTROL v2.1</h2>Master Kandang & Periode Online</header><main><div class="card"><b id="status">Memeriksa sesi...</b><p id="notice"></p></div><section id="login" class="card hide"><h3>Masuk</h3><form id="loginform"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Login</button></form></section><section id="app" class="hide"><div class="card"><button id="logout">Keluar</button><small>Hanya master data. Belum ada fitur transaksi uang.</small></div><div class="card"><h3>Kandang</h3><ul id="barnlist"></ul><form id="barnform" class="hide"><h4>Tambah Kandang</h4><label>Nama kandang<input id="barnname" required maxlength="120"></label><label>Pemilik sewa<input id="landlord" maxlength="120"></label><label>Lokasi<input id="location" maxlength="160"></label><label>Kapasitas<input id="capacity" type="number" min="0"></label><button>Simpan kandang</button></form></div><div class="card"><h3>Periode</h3><ul id="periodlist"></ul><form id="periodform" class="hide"><h4>Tambah Periode</h4><label>Kandang<select id="periodbarn" required></select></label><label>Tahun<input id="year" type="number" min="2020" max="2100" value="2026" required></label><label>Periode<select id="pnum"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Jenis ayam<select id="chicken"><option value="kampung">Kampung</option><option value="pejantan">Pejantan</option><option value="broiler">Broiler</option></select></label><label>Mulai<input id="start" type="date" required></label><label>Populasi awal<input id="birds" type="number" min="0"></label><button>Simpan periode</button></form><small>Durasi biasa 70–80 hari termasuk istirahat kandang.</small></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.8';
const db=createClient('https://chcpzczdshlioguzelvz.supabase.co','sb_publishable_aBHsT3QXbtPwsscxFFzDfg__ZF5mBbf');const $=id=>document.getElementById(id);let role='',barns=[];
function notify(s,bad=false){$('notice').textContent=s;$('notice').className=bad?'error':''}
function show(id,v){$(id).classList.toggle('hide',!v)}
function list(id,arr){$(id).replaceChildren();for(let x of arr.length?arr:['Belum ada data']){let li=document.createElement('li');li.textContent=x;$(id).append(li)}}
async function load(){let {data:{user}}=await db.auth.getUser();if(!user){show('login',true);show('app',false);$('status').textContent='Belum login';return}let r=await db.from('staff_roles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(r.error||!r.data?.enabled){show('login',false);show('app',false);$('status').textContent='Akses belum disetujui';return}role=r.data.role;$('status').textContent=user.email+' • '+role.toUpperCase();show('login',false);show('app',true);show('barnform',role==='admin');show('periodform',role==='admin');await refresh()}
async function refresh(){let r=await db.from('barns').select('id,name,landlord,active').order('name');if(r.error)return notify(r.error.message,true);barns=r.data||[];list('barnlist',barns.map(b=>b.name+(b.landlord?' • Pemilik: '+b.landlord:'')+(b.active?'':' • Nonaktif')));$('periodbarn').replaceChildren();for(let b of barns.filter(x=>x.active)){let o=document.createElement('option');o.value=b.id;o.textContent=b.name;$('periodbarn').append(o)}let p=await db.from('periods').select('barn_id,year,period_no,chicken_type,started_on,status').order('started_on',{ascending:false});if(p.error)return notify(p.error.message,true);list('periodlist',(p.data||[]).map(x=>(barns.find(b=>b.id===x.barn_id)?.name||'Kandang')+' • '+x.year+' / '+x.period_no+' • '+x.chicken_type+' • '+x.started_on))}
$('loginform').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)return notify(error.message,true);await load()};$('logout').onclick=async()=>{await db.auth.signOut();role='';await load()};
$('barnform').onsubmit=async e=>{e.preventDefault();if(role!=='admin')return;let {error}=await db.from('barns').insert({name:$('barnname').value.trim(),landlord:$('landlord').value.trim()||null,location:$('location').value.trim()||null,capacity:$('capacity').value?Number($('capacity').value):null});if(error)return notify(error.message,true);e.target.reset();notify('Kandang tersimpan');await refresh()};
$('periodform').onsubmit=async e=>{e.preventDefault();if(role!=='admin')return;let {error}=await db.from('periods').insert({barn_id:$('periodbarn').value,year:Number($('year').value),period_no:Number($('pnum').value),chicken_type:$('chicken').value,started_on:$('start').value,initial_birds:$('birds').value?Number($('birds').value):null});if(error)return notify(error.message,true);notify('Periode tersimpan');await refresh()};await load();
</script></html>
